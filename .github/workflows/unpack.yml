name: Unpack project
on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  unpack:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Unzip, clean up, commit
        run: |
          for z in *.zip; do unzip -o "$z" && rm -f "$z"; done
          rm -rf app/api/health
          git config user.name "github-actions"
          git config user.email "actions@users.noreply.github.com"
          git add -A
          git commit -m "Unpack project" || echo "nothing to commit"
          git push
